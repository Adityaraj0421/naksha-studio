name: Design Quality Check

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.scss'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.vue'
      - '**/*.svelte'

jobs:
  design-lint:
    name: Design Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Plain git instead of tj-actions/changed-files (compromised in CVE-2025-30066)
      - name: Get changed files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA"...HEAD -- '*.html' '*.htm' '*.css' '*.scss' '*.jsx' '*.tsx' '*.vue' '*.svelte' | tr '\n' ' ')
          if [ -n "${files// /}" ]; then echo "any_changed=true" >> "$GITHUB_OUTPUT"; else echo "any_changed=false" >> "$GITHUB_OUTPUT"; fi
          echo "all_changed_files=${files% }" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run Design Lint
        if: steps.changed-files.outputs.any_changed == 'true'
        id: lint
        # Pass changed files via env var to avoid command injection from output values
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          node scripts/design-lint.js
        continue-on-error: true

      - name: Post PR Comment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('design-lint-report.json')
              ? JSON.parse(fs.readFileSync('design-lint-report.json', 'utf-8'))
              : null;

            if (!report) return;

            const esc = s => String(s ?? '').replace(/[<>&"|]/g, c => `&#${c.charCodeAt(0)};`).replace(/\r?\n/g, ' ');
            const { score, issues, passed, failed, warnings } = report;
            let body;

            if (report.status === 'nothing-to-lint' || report.files === 0) {
              // No score: an empty run is not a perfect run.
              body = `## ➖ Design Quality Check — nothing to lint\n\n`;
              body += `None of the changed files were lintable (all are ignored by \`.design-lint.json\` or not HTML/CSS/component files), so no score was computed.\n`;
            } else {
              const emoji = score >= 90 ? '✅' : score >= 70 ? '⚠️' : '❌';
              const scoreColor = score >= 90 ? 'brightgreen' : score >= 70 ? 'yellow' : 'red';

              body = `## ${emoji} Design Quality Check — Score: ${score}/100\n\n`;
              body += `![score](https://img.shields.io/badge/Design_Score-${score}%2F100-${scoreColor})\n\n`;

              if (issues.length === 0) {
                body += `All design checks passed on ${report.files} file(s).\n`;
              } else {
                body += `| Severity | File | Rule | Issue | Fix |\n`;
                body += `|----------|------|------|-------|-----|\n`;
                for (const issue of issues) {
                  const sev = issue.severity === 'error' ? '🔴 Error' : '🟡 Warning';
                  const where = issue.line ? `${issue.file}:${issue.line}` : issue.file;
                  body += `| ${sev} | \`${esc(where)}\` | ${esc(issue.rule || issue.check)} | ${esc(issue.message)} | ${esc(issue.fix)} |\n`;
                }
                body += `\n`;
              }

              body += `<details><summary>Summary</summary>\n\n`;
              body += `- ✅ **${passed}** checks passed\n`;
              body += `- ⚠️ **${warnings}** warnings\n`;
              body += `- ❌ **${failed}** errors\n`;
              body += `\n*Run locally: \`node scripts/design-lint.js <files>\` · in Claude Code: \`/design-detect\`*\n</details>\n`;
            }
            body += `\n> Powered by [Naksha](https://github.com/Adityaraj0421/naksha-studio) · [Configure](.design-lint.json)`;

            // Find existing bot comment to update rather than creating duplicates
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Design Quality Check')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on critical issues
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Design lint found critical issues. See PR comment for details."
          exit 1
